<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Дневник | Учитель — МБОУ СОШ №12 им. А. Ломоносова</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
  body { margin:0; background:#eef2f7; color:#1c2a3a; }
  header { background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff; padding:18px 26px; box-shadow:0 2px 12px rgba(0,0,0,.15); }
  header h1 { margin:0; font-size:20px; }
  header small { opacity:.85; }
  .wrap { max-width:1200px; margin:24px auto; padding:0 16px; }
  .card { background:#fff; border-radius:14px; padding:20px; box-shadow:0 4px 18px rgba(20,40,80,.08); margin-bottom:20px; }
  .grid { display:grid; gap:14px; }
  .grid.cols-3 { grid-template-columns:repeat(3,1fr); }
  .grid.cols-4 { grid-template-columns:repeat(4,1fr); }
  @media(max-width:900px){ .grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;} }
  label { font-size:13px; font-weight:600; color:#475569; display:block; margin-bottom:4px; }
  input, select, textarea { width:100%; padding:9px 11px; border:1px solid #cbd5e1; border-radius:9px; font-size:14px; background:#f8fafc; }
  input:focus, select:focus, textarea:focus { outline:2px solid #2563eb33; border-color:#2563eb; background:#fff; }
  button { cursor:pointer; border:none; border-radius:9px; padding:10px 16px; font-weight:600; font-size:14px; transition:.15s; }
  .btn-primary { background:#2563eb; color:#fff; } .btn-primary:hover{background:#1d4ed8;}
  .btn-success { background:#16a34a; color:#fff; } .btn-success:hover{background:#15803d;}
  .btn-danger  { background:#dc2626; color:#fff; } .btn-danger:hover{background:#b91c1c;}
  .btn-ghost   { background:#e2e8f0; color:#1e293b; } .btn-ghost:hover{background:#cbd5e1;}
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
  th, td { padding:9px 10px; border-bottom:1px solid #e2e8f0; text-align:left; }
  th { background:#f1f5f9; font-size:13px; text-transform:uppercase; letter-spacing:.4px; color:#475569; }
  .badge { padding:3px 9px; border-radius:20px; font-size:12px; font-weight:700; color:#fff; }
  .g5{background:#16a34a}.g4{background:#65a30d}.g3{background:#f59e0b}.g2{background:#dc2626}
  .toast { position:fixed; bottom:20px; right:20px; background:#1e293b; color:#fff; padding:12px 18px; border-radius:10px; opacity:0; transition:.3s; z-index:99;}
  .toast.show{opacity:1;}
  h2 { margin:0 0 14px; font-size:18px; }
  .hint { font-size:12px; color:#64748b; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>📘 Электронный журнал — МБОУ СОШ №12 им. Алексея Ломоносова</h1>
  <small>Кабинет учителя</small>
</header>

<div class="wrap">

  <!-- ВЫБОР УЧИТЕЛЯ -->
  <div class="card">
    <h2>👩‍🏫 Вход учителя</h2>
    <div class="grid cols-3">
      <div>
        <label>Логин учителя</label>
        <input id="login" placeholder="например: ivanova">
      </div>
      <div>
        <label>Пароль</label>
        <input id="pass" type="password" placeholder="••••••">
      </div>
      <div style="display:flex; align-items:flex-end;">
        <button class="btn-primary" onclick="loginTeacher()">Войти</button>
      </div>
    </div>
    <div class="hint">Логин/пароль выдаёт директор в своём кабинете.</div>
  </div>

  <div id="teacherPanel" style="display:none">

    <!-- ВЫБОР КЛАССА -->
    <div class="card">
      <h2>🎓 Выбор класса</h2>
      <div class="grid cols-3">
        <div>
          <label>Класс</label>
          <select id="selClass"></select>
        </div>
        <div>
          <label>Предмет</label>
          <select id="selSubject">
            <option>Математика</option><option>Русский язык</option><option>Литература</option>
            <option>История</option><option>Физика</option><option>Химия</option>
            <option>Биология</option><option>География</option><option>Английский язык</option>
            <option>Информатика</option><option>Обществознание</option><option>Чтение</option>
          </select>
        </div>
        <div style="display:flex; align-items:flex-end;">
          <button class="btn-primary" onclick="loadStudents()">Показать учеников</button>
        </div>
      </div>
    </div>

    <!-- ДНЕВНИК КЛАССА -->
    <div class="card">
      <h2>📋 Журнал класса</h2>
      <table id="tbl">
        <thead>
          <tr>
            <th>Ученик</th>
            <th>Оценки</th>
            <th>Триместр</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- ФОРМА ОЦЕНКИ -->
    <div class="card">
      <h2>➕ Поставить оценку</h2>
      <div class="grid cols-4">
        <div>
          <label>Ученик</label>
          <select id="selStudent"></select>
        </div>
        <div>
          <label>Оценка (2–5)</label>
          <select id="selMark"><option>5</option><option>4</option><option>3</option><option>2</option></select>
        </div>
        <div>
          <label>За что</label>
          <select id="selType">
            <option>Домашняя работа</option>
            <option>Контрольная работа</option>
            <option>Тест</option>
            <option>Чтень</option>
            <option>Работа с документами</option>
            <option>Ведение тетради</option>
          </select>
        </div>
        <div>
          <label>Дата</label>
          <input type="date" id="markDate">
        </div>
      </div>
      <div class="grid cols-4" style="margin-top:14px">
        <div style="grid-column:span 3">
          <label>Комментарий (необязательно)</label>
          <input id="markComment" placeholder="Например: отлично раскрыта тема">
        </div>
        <div style="display:flex; align-items:flex-end;">
          <button class="btn-success" onclick="addMark()">Поставить</button>
        </div>
      </div>
    </div>

    <!-- ДОМАШНЕЕ ЗАДАНИЕ -->
    <div class="card">
      <h2>🏠 Задать домашнее задание</h2>
      <div class="grid cols-3">
        <div>
          <label>Дата</label>
          <input type="date" id="hwDate">
        </div>
        <div style="grid-column:span 2">
          <label>Задание</label>
          <textarea id="hwText" rows="2" placeholder="§12, стр. 45-47, упр. 3,4"></textarea>
        </div>
      </div>
      <div style="margin-top:12px">
        <button class="btn-primary" onclick="addHomework()">Задать ДЗ</button>
      </div>
    </div>

    <!-- ОТЧЁТ -->
    <div class="card">
      <h2>📊 Отчёт по оценкам</h2>
      <button class="btn-ghost" onclick="buildReport()">Сформировать отчёт</button>
      <div id="report" style="margin-top:14px; font-size:14px;"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, set, push, remove, child, update }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkXCeupv0otnvEkXuFLuPUI0NcVixqWXA",
  authDomain: "renessans-bank-3df94.firebaseapp.com",
  databaseURL: "https://renessans-bank-3df94-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "renessans-bank-3df94",
  storageBucket: "renessans-bank-3df94.firebasestorage.app",
  messagingSenderId: "544580970197",
  appId: "1:544580970197:web:b270bf956d6c867102645c"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

let teacher = null;
let currentClass = "";

/* ============ УТИЛИТЫ ============ */
const LETTERS = ["А","Б","В","Г","Д","Е"];
function classesList(){
  const arr=[];
  for(let n=1;n<=11;n++) for(const L of LETTERS) arr.push(`${n}${L}`);
  return arr;
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function markBadge(m){
  const cls = m==5?'g5':m==4?'g4':m==3?'g3':'g2';
  return `<span class="badge ${cls}">${m}</span>`;
}
function avgToMark(avg){
  if(avg>=4.5) return 5;
  if(avg>=3.5) return 4;
  if(avg>=2.5) return 3;
  return 2;
}

/* ============ ВХОД УЧИТЕЛЯ ============ */
window.loginTeacher = async () => {
  const login = document.getElementById('login').value.trim();
  const pass  = document.getElementById('pass').value.trim();
  if(!login||!pass) return toast('Введите логин и пароль');
  const snap = await get(ref(db,'teachers'));
  const list = snap.val()||{};
  const found = Object.entries(list).find(([id,t])=>t.login===login && t.password===pass);
  if(!found) return toast('❌ Неверный логин или пароль');
  teacher = { id: found[0], ...found[1] };
  document.getElementById('teacherPanel').style.display='block';
  document.getElementById('selClass').innerHTML = classesList().map(c=>`<option>${c}</option>`).join('');
  document.getElementById('markDate').valueAsDate = new Date();
  document.getElementById('hwDate').valueAsDate = new Date();
  toast(`Добро пожаловать, ${teacher.fio}`);
};

/* ============ ЗАГРУЗКА УЧЕНИКОВ ============ */
window.loadStudents = async () => {
  currentClass = document.getElementById('selClass').value;
  const snap = await get(ref(db,'students'));
  const all = snap.val()||{};
  const students = Object.entries(all).filter(([,s])=>s.class===currentClass);
  const tbody = document.querySelector('#tbl tbody');
  const selSt = document.getElementById('selStudent');
  tbody.innerHTML=''; selSt.innerHTML='';
  if(!students.length){ tbody.innerHTML='<tr><td colspan="4">Нет учеников в классе</td></tr>'; return; }

  const subject = document.getElementById('selSubject').value;
  const marksSnap = await get(ref(db,'marks'));
  const allMarks = marksSnap.val()||{};

  for(const [id,s] of students){
    const myMarks = Object.entries(allMarks)
      .filter(([,m])=>m.studentId===id && m.subject===subject)
      .map(([mid,m])=>({mid,...m}));
    const nums = myMarks.map(m=>+m.value);
    const avg = nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : 0;
    const tri = nums.length ? avgToMark(avg) : '—';

    tbody.innerHTML += `
      <tr>
        <td><b>${s.fio}</b><br><small>${s.birth||''}</small></td>
        <td>${myMarks.map(m=>`${markBadge(m.value)} <small>${m.type}</small>
             <button class="btn-danger" style="padding:2px 6px;font-size:11px"
               onclick="delMark('${m.mid}')">✕</button>`).join('<br>') || '—'}</td>
        <td><b>${tri}</b> <small>(сред. ${avg?avg.toFixed(2):'—'})</small></td>
        <td>
          <button class="btn-ghost" style="padding:5px 10px;font-size:12px"
            onclick="quickMark('${id}',5)">5</button>
          <button class="btn-ghost" style="padding:5px 10px;font-size:12px"
            onclick="quickMark('${id}',4)">4</button>
          <button class="btn-ghost" style="padding:5px 10px;font-size:12px"
            onclick="quickMark('${id}',3)">3</button>
          <button class="btn-ghost" style="padding:5px 10px;font-size:12px"
            onclick="quickMark('${id}',2)">2</button>
        </td>
      </tr>`;
    selSt.innerHTML += `<option value="${id}">${s.fio}</option>`;
  }
};

/* ============ ОЦЕНКИ ============ */
window.addMark = async () => {
  const studentId = document.getElementById('selStudent').value;
  const value = +document.getElementById('selMark').value;
  const type  = document.getElementById('selType').value;
  const date  = document.getElementById('markDate').value;
  const comment = document.getElementById('markComment').value.trim();
  const subject = document.getElementById('selSubject').value;
  if(!studentId) return toast('Выберите ученика');
  await push(ref(db,'marks'), {
    studentId, value, type, date, comment, subject,
    teacherId: teacher.id, teacherFio: teacher.fio,
    createdAt: Date.now()
  });
  toast('✅ Оценка поставлена');
  loadStudents();
};

window.quickMark = async (studentId, value) => {
  await push(ref(db,'marks'), {
    studentId, value, type:'Домашняя работа',
    date:new Date().toISOString().slice(0,10),
    subject: document.getElementById('selSubject').value,
    teacherId: teacher.id, teacherFio: teacher.fio,
    createdAt: Date.now()
  });
  toast(`Оценка ${value} поставлена`);
  loadStudents();
};

window.delMark = async (mid) => {
  if(!confirm('Удалить оценку?')) return;
  await remove(ref(db,'marks/'+mid));
  toast('Оценка удалена');
  loadStudents();
};

/* ============ ТРИМЕСТР ============ */
window.setTerm = async () => {
  const sid = document.getElementById('selStudent').value;
  if(!sid) return toast('Выберите ученика');
  const subject = document.getElementById('selSubject').value;
  const val = prompt('Введите триместровую оценку (2–5). Она будет неизменяемой:');
  if(!val || !['2','3','4','5'].includes(val)) return toast('Некорректно');
  await set(ref(db,`terms/${currentClass}_${subject}_${sid}`), {
    studentId: sid, subject, className: currentClass,
    value: +val, setBy: teacher.fio, setAt: Date.now()
  });
  toast('Триместровая оценка сохранена (изменение только через сброс)');
};

/* ============ ДЗ ============ */
window.addHomework = async () => {
  const date = document.getElementById('hwDate').value;
  const text = document.getElementById('hwText').value.trim();
  const subject = document.getElementById('selSubject').value;
  if(!text) return toast('Введите текст ДЗ');
  await push(ref(db,'homework'), {
    class: currentClass, subject, date, text,
    teacherFio: teacher.fio, createdAt: Date.now()
  });
  toast('✅ ДЗ задано');
  document.getElementById('hwText').value='';
};

/* ============ ОТЧЁТ ============ */
window.buildReport = async () => {
  const subject = document.getElementById('selSubject').value;
  const snap = await get(ref(db,'marks'));
  const all = snap.val()||{};
  const studentsSnap = await get(ref(db,'students'));
  const students = studentsSnap.val()||{};

  const rows = {};
  for(const [id,m] of Object.entries(all)){
    if(m.subject!==subject) continue;
    const s = students[m.studentId];
    if(!s || s.class!==currentClass) continue;
    if(!rows[id]) rows[id]={fio:s.fio, marks:[]};
    rows[id].marks.push(+m.value);
  }
  let html = `<table><thead><tr><th>Ученик</th><th>Кол-во</th><th>Средний</th><th>Рекоменд. триместр</th></tr></thead><tbody>`;
  for(const r of Object.values(rows)){
    const avg = r.marks.reduce((a,b)=>a+b,0)/r.marks.length;
    html += `<tr><td>${r.fio}</td><td>${r.marks.length}</td><td>${avg.toFixed(2)}</td><td><b>${avgToMark(avg)}</b></td></tr>`;
  }
  html += `</tbody></table>`;
  document.getElementById('report').innerHTML = html || 'Нет данных';
};
</script>
</body>
</html>
