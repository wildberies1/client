<title>🏛️ Дневник | Директор — МБОУ СОШ №12 им. А. Ломоносова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Marck+Script&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Montserrat', 'Segoe UI', sans-serif;
    color: #1c2a3a; min-height: 100vh;
    background-color: #f7f4e9;
    background-image:
      linear-gradient(rgba(120,180,220,.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,180,220,.22) 1px, transparent 1px);
    background-size: 24px 24px; background-position: -1px -1px;
  }
  body::before {
    content: ""; position: fixed; top: 0; left: 40px; bottom: 0;
    width: 2px; background: rgba(220,80,80,.35); z-index: 0; pointer-events: none;
  }
  @media (max-width: 700px) { body::before { display: none; } }

  header {
    position: relative;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.06), transparent 60%),
      linear-gradient(160deg, #6b1d1d 0%, #a03030 55%, #4a0e0e 100%);
    color: #fff; padding: 22px 30px;
    border-bottom: 8px solid #8b5a2b;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); overflow: hidden;
  }
  .header-inner {
    position: relative; z-index: 1;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px;
    max-width: 1240px; margin: 0 auto;
  }
  header h1 {
    margin: 0; font-size: 24px;
    font-family: 'Marck Script', 'Caveat', cursive;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  header small {
    display: block; font-size: 13px; margin-top: 4px;
    opacity: .85; letter-spacing: 2px; text-transform: uppercase;
  }
  .badge-role {
    display: inline-block; background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.35);
    padding: 5px 14px; border-radius: 30px;
    font-size: 12px; font-weight: 700;
  }

  .tabs {
    display: flex; gap: 6px; max-width: 1240px;
    margin: 18px auto 0; padding: 0 16px; flex-wrap: wrap;
  }
  .tab {
    background: #fffdf5; border: none; padding: 10px 20px;
    border-radius: 10px 10px 0 0; font-weight: 700;
    cursor: pointer; color: #6b5d3f; font-size: 14px;
    transition: .15s; box-shadow: 0 -2px 4px rgba(0,0,0,.05);
  }
  .tab:hover { background: #fef2f2; }
  .tab.active {
    background: linear-gradient(160deg, #a03030, #6b1d1d);
    color: #fff;
  }
  .wrap { max-width: 1240px; margin: 0 auto 24px; padding: 0 16px; }
  .card {
    background: #fffdf5;
    border-radius: 0 14px 14px 14px;
    padding: 24px; box-shadow: 0 6px 20px rgba(80,60,20,.12);
    border: 1px solid #ece2c9;
  }
  .card h2 {
    margin: 0 0 18px; font-size: 19px; color: #6b1d1d; font-weight: 700;
    border-bottom: 2px dashed #d8ceb0; padding-bottom: 10px;
  }
  .grid { display: grid; gap: 12px; }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 900px) { .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; } }

  label {
    font-size: 12px; font-weight: 700; color: #6b5d3f;
    display: block; margin-bottom: 5px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  input, select {
    width: 100%; padding: 10px 12px;
    border: 2px solid #d8ceb0; border-radius: 8px;
    font-size: 14px; background: #fffef9;
    font-family: inherit; transition: .15s;
  }
  input:focus, select:focus {
    outline: none; border-color: #a03030;
    box-shadow: 0 0 0 3px rgba(160,48,48,.15);
  }
  button {
    cursor: pointer; border: none; border-radius: 8px;
    padding: 10px 18px; font-weight: 700; font-size: 14px;
    transition: .15s; font-family: inherit;
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }
  button:active { transform: translateY(2px); }
  .btn-primary { background: linear-gradient(180deg, #a03030, #6b1d1d); color: #fff; }
  .btn-primary:hover { background: linear-gradient(180deg, #b03a3a, #6b1d1d); }
  .btn-success { background: linear-gradient(180deg, #4caf50, #388e3c); color: #fff; }
  .btn-danger { background: linear-gradient(180deg, #e35d5d, #c0392b); color: #fff; }
  .btn-ghost { background: #f0e9d2; color: #4a3f2a; box-shadow: 0 3px 0 #d8ceb0; }
  .btn-ghost:hover { background: #e8dec0; }
  .btn-sm { padding: 5px 10px; font-size: 12px; box-shadow: 0 2px 0 rgba(0,0,0,.15); }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th, td { padding: 11px 10px; border-bottom: 1px solid #ece2c9; text-align: left; vertical-align: top; }
  th {
    background: linear-gradient(180deg, #f0e9d2, #e6ddc0);
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: #6b5d3f; border-bottom: 2px solid #d8ceb0;
  }
  tr:hover td { background: #fffef3; }

  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 30px; height: 30px; border-radius: 50%;
    font-size: 15px; font-weight: 900; color: #fff;
    font-family: 'Caveat', cursive;
    box-shadow: 0 2px 4px rgba(0,0,0,.25), inset 0 -2px 3px rgba(0,0,0,.15);
    border: 2px solid rgba(255,255,255,.5); transform: rotate(-3deg);
  }
  .g5 { background: radial-gradient(circle at 30% 30%, #57bb5b, #2e7d32); }
  .g4 { background: radial-gradient(circle at 30% 30%, #a4c93e, #6a8f1c); }
  .g3 { background: radial-gradient(circle at 30% 30%, #f5b042, #d18b15); }
  .g2 { background: radial-gradient(circle at 30% 30%, #ec6b6b, #b71c1c); }
